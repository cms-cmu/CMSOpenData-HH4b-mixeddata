# Week 5 consolidated-Parquet HH-only evaluation smoke test

main:
  module: evaluate
  option:
    - --max-evaluators 1
    - --device cpu

model:
  - module: HCR.SvB.ggF.baseline.Eval
    option:
      - --models
      - Final
      - "{model}/result.json"

dataset:
  - module: HCR.SvB.Eval
    option:
      - --metadata configs/metadata/datasets_HH4b_Run2/2024_v2_week5_parquet/
      - --mc-processes ggF
      - --data-source
      - --ggf-load-kl 1
      - --test-files 1
      - --max-workers 1
      - --train-chunksize 5000
      - --max-root-chunks 2
      - --max-eval-events 100

analysis:
  - module: kfold.Merge
    option:
      - --name SvB
      - --step 100000
      - --workers 1
      - --clean

setting:
  - module: IO
    option:
      - output: "{SvB}"
  - module: ml.DataLoader
    option:
      - num_workers: 0
