[workspace]
name = "hh4b-hcr-classifier"
version = "0.1.0"
description = "Portable HCR classifier and ROOT-to-Parquet utilities for HH4b"
channels = ["conda-forge", "bioconda"]
platforms = [
    "linux-64",
    {
        name = "linux-64-cuda",
        platform = "linux-64",
        cuda = "12.9"
    },
]

# ------------------------------------------------------------------
# Shared classifier and workflow dependencies
# ------------------------------------------------------------------

[dependencies]
python = ">=3.13,<3.14"
pip = "*"

snakemake = "*"
snakemake-executor-plugin-slurm = "*"
snakemake-executor-plugin-htcondor = "*"
snakemake-executor-plugin-cluster-generic = "*"

git = "*"
graphviz = "*"

# Avoid the incompatible AVX-512 libopenblas build encountered on
# AMD EPYC worker nodes.
libopenblas = "<0.3.30"

fsspec = ">=2026.6.0,<2027"
awkward = ">=2.10.0,<3"
uproot = ">=5.7.5,<6"
xrootd = ">=6.1.0,<7"
tblib = ">=3.2.2,<4"
fsspec-xrootd = ">=0.5.2,<0.6"
awkward-pandas = ">=2023.8.0,<2024"

[pypi-dependencies]
snkmt = {
    git = "https://github.com/alefisico/snkmt.git",
    branch = "feat-dask-condor-monitor"
}
snakemake-logger-plugin-snkmt = {
    git = "https://github.com/cademirch/snakemake-logger-plugin-snkmt.git"
}

[tasks]
snakemake = "snakemake"
snkmt = "snkmt"
install = "pixi install"
shell = "bash"
conversion-dry-run = """
python tools/data_conversion/build_production_parquets.py --dry-run
"""

# ------------------------------------------------------------------
# CPU environment
# ------------------------------------------------------------------

[feature.cpu]
platforms = ["linux-64"]

[feature.cpu.dependencies]
pytorch-cpu = ">=2.12.1,<3"

# ------------------------------------------------------------------
# GPU environment
# ------------------------------------------------------------------

[feature.gpu]
platforms = ["linux-64-cuda"]

[feature.gpu.dependencies]
pytorch-gpu = ">=2.12.1,<3"
cuda-version = "12.9.*"

# ------------------------------------------------------------------
# Development environment
# ------------------------------------------------------------------

[feature.dev.dependencies]
# Add development-only packages here when required.
# jupyter = "*"
# ipython = "*"

# ------------------------------------------------------------------
# HEPData environment
# ------------------------------------------------------------------

[feature.hepdata]
platforms = ["linux-64"]

[feature.hepdata.dependencies]
python = ">=3.11"
pip = "*"

[feature.hepdata.pypi-dependencies]
hepdata-validator = "*"
hepdata-lib = "*"

[feature.hepdata.tasks]
validate = "hepdata-validate"

# ------------------------------------------------------------------
# REANA environment
# ------------------------------------------------------------------

[feature.reana]
platforms = ["linux-64"]

[feature.reana.dependencies]
python = ">=3.11"
pip = "*"
setuptools = "<70.0.0"
snakemake = "==9.16.3"
jsonschema = "<4.10.0"
packaging = "<26"

[feature.reana.pypi-dependencies]
reana-client = ">=0.95.0a1"
reana-commons = {
    git = "https://github.com/alefisico/reana-commons",
    rev = "8dcdb5d6dd16893895ee18ec3d6c3564e6cbac2d"
}
rdflib-jsonld = ">=0.6.0"

[feature.reana.activation.env]
PYTHONNOUSERSITE = "1"

# ------------------------------------------------------------------
# Named environments
# ------------------------------------------------------------------

[environments]
# Portable CPU environment used by default.
default = {
    features = ["cpu"],
    solve-group = "cpu"
}

# CPU environment with development tools.
dev = {
    features = ["cpu", "dev"],
    solve-group = "cpu"
}

# CUDA environment for training and GPU evaluation.
gpu = {
    features = ["gpu"],
    solve-group = "gpu"
}

# Independent lightweight environments.
hepdata = {
    features = ["hepdata"],
    solve-group = "hepdata",
    no-default-feature = true
}

reana = {
    features = ["reana"],
    solve-group = "reana",
    no-default-feature = true
}
