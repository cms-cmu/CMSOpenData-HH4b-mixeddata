# Standalone SvB evaluation config
#
# template:
# - model: path to trained model
# - SvB: path to SvB friend-tree output

main:
  module: evaluate
  option:
    - --max-evaluators 1
    - --device cpu

model:
  - module: HCR.SvB.ggF.baseline.Eval
    option:
      - --models
      - Final
      - "{model}/result.json"

dataset:
  - module: HCR.SvB.Eval
    option:
      - --metadata configs/metadata/datasets_HH4b_Run2/2024_v2_cmu_eval2/
      - --test-files 2
      - --max-workers 1
      - --train-chunksize 5000
      - --max-root-chunks 2
      - --max-eval-events 100
      - --mc-processes
      - --ggf-load-kl 1
      - --friends "" configs/metadata/datasets_HH4b_Run2/2024_v2_cmu_eval2/classifier_inputs_week3_cmu_parquet.json@@HCR_input

analysis:
  - module: kfold.Merge
    option:
      - --name SvB
      - --step 100000
      - --workers 1
      - --clean

setting:
  - module: IO
    option:
      - output: "{SvB}"
  - module: ml.DataLoader
    option:
      - num_workers: 0
