# Standalone SvB workflow config
#
# This file is adapted from the original coffea4bees SvB workflow config.
# The goal is to run training and evaluation outside barista + coffea4bees.

eos_base: "."
plot_base: "outputs/SvB_standalone_test/plots"

classifier_config_paths: "."
wfs_base: configs/workflows/SvB
label: SvB_standalone_test
output_dir: outputs/SvB_standalone_test

plot_inputs: false
plot_weights: false

model: "outputs/SvB_standalone_test/classifier"
friend: "outputs/SvB_standalone_test/friend"

train_template: "model: outputs/SvB_standalone_test/classifier, FvT: inputs/friend/FvT_nominal"
eval_template: "model: outputs/SvB_standalone_test/classifier, SvB: outputs/SvB_standalone_test/friend"

metadata: "configs/metadata/datasets_HH4b_Run2/2024_v2/classifier_inputs_week3_cmu.json@@HCR_input"
